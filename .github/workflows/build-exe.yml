name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build PhotoCraft (release)
        run: cargo build -p photocraft --release

      - name: List what will be uploaded (for debugging)
        run: dir target\release\*.exe, target\release\*.dll
        shell: cmd

      - name: Upload exe + ONNX Runtime
        uses: actions/upload-artifact@v7
        with:
          name: photocraft-windows
          path: |
            target/release/photocraft.exe
            target/release/*.dll
          if-no-files-found: error
